<!doctype html><html lang="ja"><meta charset="utf-8"><p id="status">スタイルを取得中…</p>
<button id="save" disabled>CSVを保存</button><button id="close">閉じる</button>
<script>
let csv = null;
const status = document.getElementById("status"), save = document.getElementById("save");
window.onmessage = event => {
  if (event.source !== parent) return;
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "save-csv") { csv = msg; save.disabled = false; status.textContent = "CSVを保存できます。"; }
  if (msg.type === "error") status.textContent = msg.message;
};
save.onclick = () => {
  if (!csv) return;
  let url;
  try {
  url = URL.createObjectURL(new Blob(["\uFEFF", csv.content], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = csv.filename;
  document.body.appendChild(a); a.click(); a.remove();
  status.textContent = "保存を要求しました。ダウンロード先を確認してください。";
  } catch (_) {
    status.textContent = "保存を開始できませんでした。再度保存するか、実行環境を確認してください。";
  } finally {
    if (url) setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
};
document.getElementById("close").onclick = () => parent.postMessage({ pluginMessage: { type: "done" } }, "*");
parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
</script></html>
