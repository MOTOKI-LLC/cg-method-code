<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<label>範囲 <select id="scope">
  <option value="current">現在のページ</option>
  <option value="all">全ページ</option>
</select></label>
<button id="run" type="button">CSVを作る</button>
<p id="status" role="status"></p>
<script>
const run = document.getElementById('run');
const statusEl = document.getElementById('status');
run.onclick = () => {
  run.disabled = true;
  statusEl.textContent = '走査中';
  parent.postMessage({ pluginMessage: {
    type: 'export', scope: document.getElementById('scope').value
  } }, '*');
};
window.onmessage = event => {
  if (event.source !== parent) return;
  const msg = event.data && event.data.pluginMessage;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'error') {
    run.disabled = false;
    statusEl.textContent = msg.message;
  }
  if (msg.type !== 'result') return;
  try {
    const url = URL.createObjectURL(new Blob(['\uFEFF', msg.csv], {
      type: 'text/csv;charset=utf-8'
    }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'external-styles.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    statusEl.textContent = msg.count + '行（取得不能' + msg.unresolved +
      '行）。保存を要求しました。保存先を確認してください。';
  } catch (error) {
    statusEl.textContent = '保存を開始できませんでした';
  } finally {
    run.disabled = false;
  }
};
</script>
</html>
