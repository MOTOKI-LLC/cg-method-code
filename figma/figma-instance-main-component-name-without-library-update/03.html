<!doctype html><html lang="ja"><meta charset="utf-8">
<style>body{font:13px/1.5 sans-serif;padding:12px}button{margin:4px}li{margin:10px 0;overflow-wrap:anywhere}</style>
<button id="scan">スキャン</button><button id="rename" disabled>表示した差分を変更</button>
<p id="status">選択範囲を確認してください。未選択は現在のページです。</p><ul id="list"></ul>
<script>
let results = [];
const scan = document.getElementById("scan"), rename = document.getElementById("rename");
const status = document.getElementById("status"), list = document.getElementById("list");
function send(message) { parent.postMessage({ pluginMessage: message }, "*"); }
function lock() { scan.disabled = rename.disabled = true; }
scan.onclick = () => { lock(); status.textContent = "取得中…"; send({ type: "scan" }); };
rename.onclick = () => {
  if (!results.length || !confirm("表示したインスタンスの名前を変更しますか？")) return;
  lock(); send({ type: "rename-all", ids: results.map(r => r.instanceId) });
};
window.onmessage = event => {
  if (event.source !== parent) return;
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  scan.disabled = false;
  if (msg.type === "scan-result") {
    results = msg.results; list.replaceChildren();
    for (const r of results) {
      const li = document.createElement("li"), button = document.createElement("button");
      button.textContent = r.instanceName + " → " + r.mainName + "（" + r.source + "）";
      button.onclick = () => send({ type: "focus", instanceId: r.instanceId });
      li.appendChild(button); list.appendChild(li);
    }
    status.textContent = `差分${results.length}件 / 取得不可${msg.skipped}件 / 公開情報取得不可${msg.fallback}件`;
    rename.disabled = !results.length;
  } else if (msg.type === "renamed") {
    results = []; rename.disabled = true;
    status.textContent = `変更${msg.updated}件 / スキップ${msg.skipped}件。再スキャンしてください。`;
  } else if (msg.type === "error") { results = []; rename.disabled = true; status.textContent = msg.message; }
};
</script></html>
