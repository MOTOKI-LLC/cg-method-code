<!doctype html><html lang="ja"><meta charset="utf-8">
<button id="start">開始</button><button id="cancel" disabled>中止</button><button id="save" disabled>CSV保存</button>
<p id="status">待機中</p><p id="latest"></p>
<script>
const start = document.getElementById("start"), cancel = document.getElementById("cancel"), save = document.getElementById("save");
const status = document.getElementById("status"), latest = document.getElementById("latest");
let chunks = [], count = 0;
function cell(value) {
  let s = String(value == null ? "" : value);
  if (/^[=+@\-\t\r\n]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function send(type) { parent.postMessage({ pluginMessage: { type } }, "*"); }
start.onclick = () => { start.disabled = true; cancel.disabled = false; save.disabled = true; status.textContent = "開始を要求…"; send("start"); };
cancel.onclick = () => { cancel.disabled = true; status.textContent = "中止を要求…"; send("cancel"); };
window.onmessage = event => {
  if (event.source !== parent) return;
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "reset") {
    count = 0; chunks = ["\uFEFF" + ["親コンポ名","親ノードID","バリアント名","バリアントID","レイヤーパス"].map(cell).join(",") + "\r\n"];
    latest.textContent = "";
  } else if (msg.type === "append") {
    chunks.push(msg.rows.map(r => [r.parentName,r.parentId,r.variantName,r.variantId,r.path].map(cell).join(",")).join("\r\n") + "\r\n");
    count += msg.rows.length;
    const last = msg.rows[msg.rows.length-1]; latest.textContent = last.path;
  } else if (msg.type === "progress") status.textContent = `ページ${msg.currentPage}/${msg.pages} ${msg.page} / 走査${msg.visited}件 / 出力${msg.produced}行`;
  else if (msg.type === "done" || msg.type === "error") {
    start.disabled = false; cancel.disabled = true; save.disabled = !count;
    status.textContent = msg.type === "error" ? msg.message : (msg.cancelled ? "中止（途中まで）" : "完了") + `：${count}行`;
  }
};
save.onclick = () => {
  const url = URL.createObjectURL(new Blob(chunks, { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = "components.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};
</script></html>
