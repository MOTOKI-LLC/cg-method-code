<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Swap Multi Target</title>
  <style>
    body { font-family: Inter, sans-serif; margin: 12px; font-size: 12px; }
    .row { display: flex; align-items: center; margin-bottom: 8px; }
    .val { flex: 1; padding: 6px 8px; background: #f5f5f5; border-radius: 6px; }
    button { margin-left: 6px; font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #18a0fb; color: #fff; border-color: #18a0fb; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    ul { margin: 4px 0; padding-left: 16px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="val" id="sourceVal">source 未登録</div>
    <button id="btnCapSource">登録</button>
  </div>
  <div class="row">
    <div class="val">target 複数可</div>
    <button id="btnCapTarget">追加</button>
    <button id="btnClearTargets">クリア</button>
  </div>
  <ul id="targetList"></ul>
  <div class="row">
    <button id="btnSwap" class="primary" disabled style="flex:1;">差し替え実行</button>
  </div>

  <script>
    var $sourceVal = document.getElementById('sourceVal');
    var $targetList = document.getElementById('targetList');
    var $btnSwap   = document.getElementById('btnSwap');

    function post(type, payload){
      parent.postMessage({ pluginMessage: { type: type, payload: payload||{} } }, '*');
    }

    document.getElementById('btnCapSource').onclick = function(){ post('capture-source'); };
    document.getElementById('btnCapTarget').onclick = function(){ post('capture-target'); };
    document.getElementById('btnClearTargets').onclick = function(){ post('clear-targets'); };
    $btnSwap.onclick = function(){ post('swap-now'); };

    onmessage = function(e){
      var m = e.data.pluginMessage;
      if (!m || m.type !== 'state') return;
      $sourceVal.textContent = m.payload.sourceName || "source 未登録";
      $btnSwap.disabled = !(m.payload.hasSource && m.payload.hasTarget);

      $targetList.innerHTML = "";
      for (var i=0; i<m.payload.targets.length; i++){
        var li = document.createElement("li");
        li.textContent = m.payload.targets[i].name;
        $targetList.appendChild(li);
      }
    };
  </script>
</body>
</html>
