  <header id="header" class="d-flex flex-wrap gap-2 mb-3">

            data-actions-box="true" data-selected-text-format="count > 3" size="4"></select>

    <select id="select_chara"  class="selectpicker" multiple title="アイテム名"
            data-actions-box="true" data-selected-text-format="count > 3"></select>

    <select id="select_tag"    class="selectpicker" multiple title="タグ"
            data-live-search="true" data-actions-box="true"
            data-live-search-placeholder="Search" data-selected-text-format="count > 3"></select>

    <button id="btn-search" class="btn btn-success">検索</button>
    <button class="btn btn-info" onclick="window.open('https://docs.google.com/spreadsheets/d/xxxxxxxxx/edit?gid=0#gid=0')">シート</button>
  </header>

  </nav>
